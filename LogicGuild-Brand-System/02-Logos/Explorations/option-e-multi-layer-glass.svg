<svg width="240" height="64" viewBox="0 0 240 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="glass_teal_e" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#00BBF9"/>
    </linearGradient>
    <linearGradient id="glass_blue_e" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4361EE"/>
      <stop offset="100%" stop-color="#3A0CA3"/>
    </linearGradient>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Layer 1: Left Vertical Blade -->
    <rect x="8" y="6" width="10" height="26" rx="5" fill="url(#glass_blue_e)"/>
    <!-- Layer 2: Intersecting Horizontal Blade with Optical Blend -->
    <rect x="8" y="24" width="30" height="10" rx="5" fill="url(#glass_teal_e)" fill-opacity="0.9"/>
    <!-- Overlap intersection highlight -->
    <rect x="8" y="24" width="10" height="8" rx="2" fill="#FFFFFF" fill-opacity="0.3"/>
  </g>

  <g transform="translate(68, 12)">
    <text x="0" y="30" font-family="'Sora', -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.035em" fill="#FFFFFF">
      Logic<tspan fill="#00F5D4">Guild</tspan>
    </text>
    <text x="2" y="44" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" letter-spacing="0.2em" fill="#94A3B8">
      DIGITAL SOLUTIONS
    </text>
  </g>
</svg>