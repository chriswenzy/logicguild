    <path d="M8 25L20 18V28L8 35V25Z" fill="url(#cyber_blue_a)"/>
    <!-- Foundational Cantilever Foot -->
    <path d="M8 38L20 31V37H36V45H8V38Z" fill="url(#cyber_dark_a)"/>
    <!-- Acid Lime Power Node -->
    <path d="M36 37H44V45H36V37Z" fill="url(#cyber_lime_a)"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(68, 12)">
    <text x="0" y="30" font-family="'Sora', -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.035em" fill="#FFFFFF">
      Logic<tspan fill="#C8FF00">Guild</tspan>
    </text>
    <text x="2" y="44" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" letter-spacing="0.22em" fill="#94A3B8">
